@if (currentPageData$ | async; as response) {
  <section class="pricing">
    <h2>Books for download</h2>
    @if (!isLoading()) {
      <ul class="pricing_list">
        @for (book of response.results; track book.id) {
          <li><app-card [bookData]="book" [handler]="handleCardClick"></app-card></li>
        }
      </ul>
    }

    <div class="pricing_pagination">
      <app-button [handler]="prevPage" [isDisabled]="isLoading() || getCurrentPage() === 1"
        >Prev</app-button
      >
      <div class="pagination-button-container">
        @for (page of visiblePages$ | async; track $index) {
          @if (page !== '...') {
            <button
              (click)="navigateTo(page)"
              [ngClass]="
                page === getCurrentPage()
                  ? 'active pricing_pagination-button'
                  : 'pricing_pagination-button'
              "
            >
              {{ page }}
            </button>
          } @else {
            <span>{{ page }}</span>
          }
        }
      </div>
      <app-button [handler]="nextPage" [isDisabled]="isLoading() || !response.next"
        >Next</app-button
      >
    </div>
  </section>
}
