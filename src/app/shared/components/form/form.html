<form [formGroup]="form()!" class="form" (ngSubmit)="onSubmit()">
  @for (item of formItems(); track $index) {
    <div class="form-field">
      <label
        [for]="item.title"
        [ngClass]="item.isRequired ? 'required form-label' : 'form-label'"
        >{{ item.title | titlecase }}</label
      >
      <input
        [id]="item.title"
        type="text"
        [formControlName]="item.title"
        autocomplete="email"
        data-testId="item.title"
        class="form-control"
      />

      @for (error of form()?.get(item.title)?.errors | keyvalue; track $index) {
        @if (form()?.get(item.title)?.touched) {
          <p class="error">{{ getErrorMessage(item.title, error.key, error.value) }}</p>
        }
      }
    </div>
  }
  <app-button [isDisabled]="form()?.status === 'INVALID' ? true : false">Send</app-button>
</form>
