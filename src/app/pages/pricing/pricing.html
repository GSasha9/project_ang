@if (currentPageData$ | async; as result) {
  <section class="pricing">
    <h2>Books for download</h2>
    @if (!isLoading()) {
      <ul class="pricing_list">
        @for (book of result.data; track book.id) {
          <li><app-card [bookData]="book" [handler]="handleCardClick"></app-card></li>
        }
      </ul>
    }

    <div class="pricing_pagination">
      <app-button [handler]="prevPage" [isDisabled]="isLoading()">Prev</app-button>
      <span>Page {{ currentPage$ | async }}</span>
      <app-button [handler]="nextPage" [isDisabled]="isLoading()">Next</app-button>
    </div>
  </section>
}
