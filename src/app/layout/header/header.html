<app-logo [logo]="logoImage"></app-logo>
<button class="burger" (click)="handleMenu()" aria-label="open menu"></button>
<div class="header-menu" [ngClass]="isMenuOpen() ? 'open' : null">
  <button class="close" (click)="handleMenu()" aria-label="close menu"></button>
  <app-menu [items]="menuItems" [isRow]="true" [routeActive]="true"></app-menu>
  <app-button [hasArrow]="true">Register Now</app-button>
</div>
