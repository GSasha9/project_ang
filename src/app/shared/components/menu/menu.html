<nav>
  <ul
    [class]="customClass()"
    [ngClass]="isRow() ? 'd-flex flex-column flex-sm-row' : 'd-flex flex-column'"
    [style.gap.px]="gap()"
  >
    @for (item of items(); track item.id) {
      @if (item.title) {
        <app-link
          [linkRoute]="item.route"
          [isRouteActive]="routeActive()"
          (click)="handleClick(item)"
          >{{ item.title }}</app-link
        >
      } @else {
        <app-link [linkRoute]="item.route" [isRouteActive]="routeActive()">
          <div class="menu-item-img" [ngStyle]="{ 'background-image': `url(${item.img})` }"></div>
        </app-link>
      }
    }
  </ul>
</nav>
