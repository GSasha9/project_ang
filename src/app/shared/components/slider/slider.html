<div class="slider_items d-block" style="width: auto"><ng-template #container></ng-template></div>

<div class="d-flex gap-2 justify-content-center clearfix">
  @for (slide of slides(); track $index) {
    <button
      (click)="renderSlide($index)"
      [ngClass]="currentIndex() === $index ? 'dot dot_active' : 'dot'"
      aria-label="slider pagination"
    ></button>
  }
</div>
